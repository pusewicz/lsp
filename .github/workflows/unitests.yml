name: unit-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macvim:
    name: macvim
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Checkout LSP plugin Code
        uses: actions/checkout@v7.0.1
      - name: Install MacVim and the language servers
        run: |
          set -euo pipefail
          brew install --cask macvim-app
          brew install llvm go gopls coreutils
          rustup component add rust-src
          arch=$(uname -m)
          if [[ $arch == arm64 ]]; then
            arch=aarch64
          fi
          mkdir -p ~/.local/bin
          # Use version v0.3.2011 as the later versions fail the tests
          curl -fsSL "https://github.com/rust-lang/rust-analyzer/releases/download/2024-06-24/rust-analyzer-$arch-apple-darwin.gz" \
            | gunzip -c - > ~/.local/bin/rust-analyzer
          chmod +x ~/.local/bin/rust-analyzer
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Install the TypeScript language server
        working-directory: test
        run: npm ci
      - name: Test the test runner
        working-directory: test
        run: ./runner_selftest.sh
      - name: Run Tests
        env:
          LSP_DEBUG: 1
        run: |
          set -euo pipefail
          sw_vers
          rust-analyzer --version
          /Applications/MacVim.app/Contents/MacOS/Vim --version
          cd test
          ./run_tests.sh
      - name: Upload the language server logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-logs
          path: |
            /tmp/lsp-*.log
            /tmp/lsp-*.err
            test/results_*.txt
          if-no-files-found: ignore
