name: unit-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The test groups of run_tests.sh, each installing only what it needs
        tests: [clangd, others]
        # Vim in the terminal, or the MacVim GUI, where has('gui_running') holds
        ui: [terminal, gui]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      LSP_TEST_GUI: ${{ matrix.ui == 'gui' && '1' || '' }}
      # The MacVim release to test with: Homebrew's cask lags behind the Vim
      # patches that the plugin uses (see test/check_vim_version.sh)
      MACVIM_RELEASE: prerelease-183.2
    steps:
      - name: Checkout LSP plugin Code
        uses: actions/checkout@v7.0.1
      - name: Install MacVim
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o MacVim.dmg \
            "https://github.com/macvim-dev/macvim/releases/download/$MACVIM_RELEASE/MacVim.dmg"
          hdiutil attach MacVim.dmg -nobrowse -readonly -mountpoint /Volumes/MacVim
          cp -R /Volumes/MacVim/MacVim.app /Applications/
          hdiutil detach /Volumes/MacVim
          rm MacVim.dmg
          brew install coreutils fswatch
      - name: Check the MacVim version
        run: test/check_vim_version.sh
      - name: Install clangd
        if: matrix.tests == 'clangd'
        run: |
          set -euo pipefail
          brew install llvm
          "$(brew --prefix llvm)/bin/clangd" --version
      - name: Install gopls and rust-analyzer
        if: matrix.tests == 'others'
        run: |
          set -euo pipefail
          brew install go gopls
          rustup component add rust-src
          arch=$(uname -m)
          if [[ $arch == arm64 ]]; then
            arch=aarch64
          fi
          mkdir -p ~/.local/bin
          # Use version v0.3.2011 as the later versions fail the tests
          curl -fsSL "https://github.com/rust-lang/rust-analyzer/releases/download/2024-06-24/rust-analyzer-$arch-apple-darwin.gz" \
            | gunzip -c - > ~/.local/bin/rust-analyzer
          chmod +x ~/.local/bin/rust-analyzer
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.local/bin/rust-analyzer --version
      - name: Setup Node
        if: matrix.tests == 'others'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Install the TypeScript language server
        if: matrix.tests == 'others'
        working-directory: test
        run: npm ci
      - name: Test the test runner
        if: matrix.tests == 'others'
        working-directory: test
        run: ./runner_selftest.sh
      - name: Run Tests
        env:
          LSP_DEBUG: 1
        working-directory: test
        run: |
          sw_vers
          ./run_tests.sh ${{ matrix.tests }}
      - name: Upload the language server logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-logs-${{ matrix.tests }}-${{ matrix.ui }}
          path: |
            /tmp/lsp-*.log
            /tmp/lsp-*.err
            test/results_*.txt
            test/screen_*.log
          if-no-files-found: ignore
  # The status check that the main branch requires
  macvim:
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check that all the tests passed
        run: test "${{ needs.tests.result }}" = success
